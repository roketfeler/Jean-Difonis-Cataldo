{% extends "base.html" %}

{% block titulo %}Formulario de Notas{% endblock %}

{% block contenido %}
<div class="tarjeta tarjeta-form">
    <h1>Formulario de Notas</h1>

    <form method="POST" action="{{ url_for('ejercicio1') }}">
        <div class="campo">
            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" name="nota1" min="10" max="70" step="any"
                   value="{{ nota1 if nota1 is not none else '' }}" required>
        </div>

        <div class="campo">
            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" name="nota2" min="10" max="70" step="any"
                   value="{{ nota2 if nota2 is not none else '' }}" required>
        </div>

        <div class="campo">
            <label for="nota3">Nota 3:</label>
            <input type="number" id="nota3" name="nota3" min="10" max="70" step="any"
                   value="{{ nota3 if nota3 is not none else '' }}" required>
        </div>

        <div class="campo">
            <label for="asistencia">Asistencia (%):</label>
            <input type="number" id="asistencia" name="asistencia" min="0" max="100" step="any"
                   value="{{ asistencia if asistencia is not none else '' }}" required>
        </div>

        <button type="submit" class="btn-enviar">Enviar</button>
    </form>

    {% if error %}
        <div class="resultado error">{{ error }}</div>
    {% elif promedio is not none %}
        <div class="resultado">
            <div>{{ promedio }}</div>
            <div>{{ estado }}</div>
        </div>
    {% endif %}

    <a class="volver" href="{{ url_for('index') }}">← Volver al menú</a>
</div>
{% endblock %}
